[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/hearth-core",
    "crates/hearth-export",
    "crates/hearth-storage",
    "crates/hearth-server",
]

[workspace.package]
version = "0.1.2"
authors = ["Valerie"]
license = "MIT"
edition = "2024"
repository = "https://github.com/VeeLume/hearth"

[workspace.dependencies]
# Generic
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }

# RSI /citizens/<handle> scraper. `scraper` is pure HTML parsing (lives
# in hearth-core::profile); `reqwest` is the HTTP fetcher (lives in
# src-tauri/src/identity.rs). rustls-tls keeps Windows builds clean of
# OpenSSL.
scraper = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }

# Type-safe Tauri IPC + TypeScript bindings (matches sc-langpatch).
# specta features: chrono for DateTime<Utc>, uuid for the Uuid newtype.
specta = { version = "2.0.0-rc.21", features = ["chrono", "uuid", "derive"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "2.0.0-rc.21", features = ["typescript"] }

# sc-holotable umbrella crate. One pin + feature flags instead of naming the
# leaf crates and their sc-extract leaf features. `installs`/`extract`/`items`
# are what the loader touches directly; `missions` brings BlueprintPools and
# `crafting` brings the Blueprint catalog they resolve against. (extract/items
# are pulled transitively by missions/crafting, but listed for clarity.)
sc-holotable = { git = "https://github.com/VeeLume/sc-holotable.git", tag = "sc-holotable/v0.11.0", features = ["installs", "extract", "items", "missions", "crafting", "resources", "locations", "tags"] }

sc-dossier ={ git = "https://github.com/VeeLume/sc-dossier.git", tag = "v0.2.0"}

# Internal crates
hearth-core = { path = "crates/hearth-core" }
hearth-export = { path = "crates/hearth-export" }
hearth-storage = { path = "crates/hearth-storage" }

# ── Dev-profile overrides for SC parsing speed ──────────────────────────
#
# In a normal debug build, parsing Game2.dcb takes minutes and the
# edit→reload loop is unusable. These overrides optimize *only* the
# third-party SC / p4k / svarog crates while keeping our own code at
# opt-level=0 (fast compile, full debug info).
#
# Pattern: bulkhead aggressively bumps the heavy bytes-in-bytes-out
# crates to opt-level=3; sc-langpatch independently observed that
# `sc-extract-generated` (the giant generated match statement over
# every DCB record type) doesn't actually benefit beyond opt-level=1
# and that higher levels just make LLVM run forever on those matches.
# Combining both: opt-level=3 for the parsing/IO crates, opt-level=1
# for the generated match crate.

[profile.dev.package.svarog-p4k]
opt-level = 3
[profile.dev.package.svarog-datacore]
opt-level = 3
[profile.dev.package.sc-extract]
opt-level = 3
[profile.dev.package.sc-missions]
opt-level = 3
[profile.dev.package.sc-crafting]
opt-level = 3
[profile.dev.package.sc-locations]
opt-level = 3

# Generated giant-match crate — keep at 1 per sc-langpatch's note.
[profile.dev.package.sc-extract-generated]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release.package.sc-extract-generated]
opt-level = 1
