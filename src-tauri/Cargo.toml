[package]
name = "hearth"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
description = "Hearth — Star Citizen blueprint / crafting / mission tracker (desktop shell)"
default-run = "hearth"

[[bin]]
name = "hearth"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[lib]
name = "hearth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Probe example talks to CIG's backend via sc-dossier — only buildable with the
# live-sync feature (otherwise `--no-default-features --all-targets` fails on it).
[[example]]
name = "probe_owned"
required-features = ["live-sync"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Auto-update: check GitHub Releases on launch, prompt + install, relaunch.
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
dirs = "6"
encoding_rs = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono.workspace = true
reqwest.workspace = true
# Parallel per-file log scan for the history import.
rayon = "1"

# Type-safe IPC bindings exported to src/lib/bindings.ts in debug builds.
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true

# Internal crates — wiring placeholders, used from Stage 1 onwards.
hearth-core.workspace = true
hearth-storage.workspace = true
hearth-export.workspace = true

# SC data — the loader (sc_loader.rs) uses install discovery + asset/datacore
# parsing + the items/missions/crafting indices, all via the umbrella.
sc-holotable.workspace = true

sc-dossier = { workspace = true, optional = true }

[features]
default = ["live-sync"]
live-sync = ["dep:sc-dossier"]
